<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>KOSPI KOSDAQ HEATMAP</title>
    <style>
        body { background-color: #131722; color: white; text-align: center; font-family: 'Malgun Gothic', sans-serif; margin: 0; padding: 0; }
        .container { padding: 20px; }
        h1 { font-size: 24px; color: #ffeb3b; } /* 이번엔 노란색으로 바꿔서 변경 확인! */
    </style>
</head>
<body>
    <div class="container">
        <h1>🇰🇷 국내 증시 (KOSPI & KOSDAQ) 실시간 흐름</h1>
        
        <div class="tradingview-widget-container" style="margin: 0 auto; width: 98%;">
          <div class="tradingview-widget-container__widget"></div>
          <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-stock-heatmap.js" async>
          {
            "dataSource": "AllKorea",
            "grouping": "sector",
            "blockSize": "market_cap_basic",
            "blockColor": "change",
            "locale": "kr",
            "symbolUrl": "",
            "colorTheme": "dark",
            "hasTopBar": true,
            "isDataSetEnabled": false,
            "isZoomEnabled": true,
            "hasSymbolTooltip": true,
            "width": "100%",
            "height": "650"
          }
          </script>
        </div>
        
        <p style="margin-top:20px; font-weight:bold; color:#00e676;">🍓 엄마표 딸기 먹고 수익률도 상한가 가즈아! 🚀</p>
    </div>
</body>
</html>
