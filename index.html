<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOREA MARKET HEATMAP</title>
    <style>
        body { background-color: #131722; color: white; text-align: center; font-family: 'Malgun Gothic', sans-serif; margin: 0; padding: 0; }
        .container { padding: 20px; }
        h1 { font-size: 24px; color: #ef5350; } /* 제목 색상을 빨간색으로 바꿔서 변경 확인용 */
    </style>
</head>
<body>
    <div class="container">
        <h1>🇰🇷 대한민국 증시 실시간 히트맵</h1>
        
        <div class="tradingview-widget-container" style="margin: 0 auto; width: 98%;">
          <div class="tradingview-widget-container__widget"></div>
          <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-stock-heatmap.js" async>
          {
            "exchanges": ["KRX"],
            "dataSource": "AllKorea",
            "grouping": "sector",
            "blockSize": "market_cap_basic",
            "blockColor": "change",
            "locale": "kr",
            "symbolUrl": "",
            "colorTheme": "dark",
            "hasTopBar": true,
            "isDataSetEnabled": false,
            "isZoomEnabled": true,
            "hasSymbolTooltip": true,
            "width": "100%",
            "height": "600"
          }
          </script>
        </div>
        
        <p style="margin-top:20px; font-weight:bold;">🍓 오늘 사온 딸기처럼 달콤한 수익 가즈아! 🚀</p>
    </div>
</body>
</html>
