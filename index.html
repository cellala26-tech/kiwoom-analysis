<!DOCTYPE html>
<html>
<head>
    <title>키움 증권 분석 히트맵</title>
    <style>
        body { background-color: #131722; color: white; text-align: center; font-family: sans-serif; }
        h1 { margin-top: 30px; }
    </style>
</head>
<body>
    <h1>📊 실시간 시장 히트맵 (S&P 500)</h1>
    
    <div class="tradingview-widget-container" style="margin: 0 auto; width: 90%;">
      <div class="tradingview-widget-container__widget"></div>
      <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-stock-heatmap.js" async>
      {
      "exchanges": [],
      "dataSource": "S&P500",
      "grouping": "sector",
      "blockSize": "market_cap_basic",
      "blockColor": "change",
      "locale": "kr",
      "symbolUrl": "",
      "colorTheme": "dark",
      "hasTopBar": false,
      "isDataSetEnabled": false,
      "isZoomEnabled": true,
      "hasSymbolTooltip": true,
      "width": "100%",
      "height": "600"
    }
      </script>
    </div>
    <p>어제보다 더 나은 수익률을 위해! 화이팅!</p>
</body>
</html>
